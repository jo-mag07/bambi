<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bambi's Birthday Quest</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <!--HAPPY BIRTHDAY TO YOU, NAYEON-->
        <audio id="hbdty" preload="auto">
            <source src="hbdty.mp3" type="audio/mpeg">
        </audio>

                <!-- LOADING SCREEN -->
        <section id="loadingScreen" class="screen loading-screen">

            <div class="loading-particles">
                <span>💚</span>
                <span>🍀</span>
                <span>💚</span>
                <span>🍀</span>
                <span>💚</span>
                <span>🍀</span>
                <span>💚</span>
                <span>🍀</span>
                <span>💚</span>
                <span>🍀</span>
                <span>💚</span>
                <span>🍀</span>
                <span>💚</span>
                <span>🍀</span>
                <span>💚</span>
                <span>🍀</span>
                <span>💚</span>
                <span>🍀</span>
                <span>💚</span>
                <span>🍀</span>
            </div>

            <div class="loading-box">

                <div class="loading-icon">🍀</div>

                <h1>Birthday Quest</h1>

                <p id="loadingStatus">LOADING ASSETS...</p>

                <div class="loading-progress-container">
                    <div id="loadingProgressBar"></div>
                </div>

                <p id="loadingPercentage">0%</p>

                <button id="startButton" disabled>CONTINUE</button>

            </div>

        </section>



        <!-- LOGIN SCREEN -->
        <section id="loginScreen" class="screen">
            <div class="login-box">

                <h1>Birthday Quest</h1>
                <p>Enter your full name to begin.</p>
                <input
                    type="text"
                    id="nameInput"
                    placeholder="Full name"
                    autocomplete="off"
                >
                <button id="verifyButton">VERIFY</button>

            </div>
        </section>

        <!-- ERROR NOTIFICATION -->
        <div id="errorModal" class="modal hidden">
            <div class="modal-box">

                <h1>⚠ IDENTITY ERROR ⚠</h1>
                <p>
                    INCORRECT TARGET NAME!
                </p>
                <button id="exitButton">EXIT</button>

            </div>
        </div>

        <!-- VERIFICATION SCREEN -->
        <section id="verificationScreen" class="screen hidden">
            <div class="login-box">

                <h1>Verifying...</h1>

                <p id="verificationText">Checking identity...</p>

                <div class="progress-container">
                    <div id="progressBar"></div>
                </div>

                <p id="percentage">0%</p>

            </div>
        </section>


        <!-- GAME SCREEN -->
        <section id="gameScreen" class="screen hidden">
            <div class="game-intro">

                <h1>Hi there, Bab!</h1>
                <p>Some surprises awaits you there...!</p>
                <button id="continueButton">CONTINUE</button>

            </div>
        </section>

    <!--WITH A SMILE, ERASERHEAD-->
            <audio id="with_a_smile" preload="auto">
                <source src="with_a_smile.mp3" type="audio/mpeg">
            </audio>
    </main>

    <script src="script.js"></script>
</body>
</html>
